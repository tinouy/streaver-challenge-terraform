# Terraform Plan & Apply workflow.
#
# On every push or PR to main:
#   - Plans both bootstrap and main modules in parallel
#   - Saves plan artifacts for review
#
# On push to main only (not PRs):
#   - Applies bootstrap first (requires manual approval via "production" environment)
#   - Then applies main (also requires approval, runs after bootstrap succeeds)
#
# Required GitHub secrets:
#   - AWS_ACCESS_KEY_ID: IAM user access key
#   - AWS_SECRET_ACCESS_KEY: corresponding secret key
#
# Required GitHub environments:
#   - production: with required reviewers for manual approval

name: Terraform Plan & Apply

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.7"

jobs:
  # --- Plan jobs run in parallel on every push/PR ---

  bootstrap-plan:
    name: Bootstrap — Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: bootstrap
        run: terraform init

      # Save the plan as a binary file so apply uses the exact same changes.
      - name: Terraform Plan
        working-directory: bootstrap
        run: terraform plan -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-plan
          path: bootstrap/tfplan

  main-plan:
    name: Main — Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: main
        run: terraform init

      - name: Terraform Plan
        working-directory: main
        run: terraform plan -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: main-plan
          path: main/tfplan

  # --- Apply jobs run sequentially, only on push to main ---

  # Bootstrap must apply first because main depends on SSM parameters
  # written by bootstrap (ECR URL, Route53 zone ID, ACM cert ARN).
  bootstrap-apply:
    name: Bootstrap — Apply
    needs: bootstrap-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # Requires manual approval
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: bootstrap
        run: terraform init

      # Download the saved plan so we apply exactly what was reviewed.
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-plan
          path: bootstrap

      - name: Terraform Apply
        working-directory: bootstrap
        run: terraform apply tfplan

  # Main applies after bootstrap succeeds, ensuring SSM parameters exist.
  main-apply:
    name: Main — Apply
    needs: [main-plan, bootstrap-apply]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # Requires manual approval
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: main
        run: terraform init

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: main-plan
          path: main

      - name: Terraform Apply
        working-directory: main
        run: terraform apply tfplan
