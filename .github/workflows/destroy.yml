# Terraform Destroy workflow — tears down all infrastructure.
#
# Triggered ONLY manually via Actions > "Terraform Destroy" > "Run workflow".
# Never runs automatically on push/PR to prevent accidental destruction.
#
# Destroy order matters:
#   1. Main is destroyed first (VPC, ALB, ECS, etc.)
#   2. Bootstrap is destroyed second (ECR, Route53, ACM, SSM)
# This is the reverse of the apply order because main resources
# reference bootstrap outputs (e.g. ACM cert ARN, Route53 zone ID).
#
# Both steps require manual approval via the "destroy" environment.
#
# Required GitHub environments:
#   - destroy: with required reviewers

name: Terraform Destroy

on:
  workflow_dispatch: # Manual trigger only

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.7"

jobs:
  # Step 1: Destroy main infrastructure first.
  main-destroy:
    name: Main — Destroy
    runs-on: ubuntu-latest
    environment: destroy # Requires manual approval
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: main
        run: terraform init

      - name: Terraform Destroy
        working-directory: main
        run: terraform destroy -auto-approve

  # Step 2: Destroy bootstrap after main is gone.
  bootstrap-destroy:
    name: Bootstrap — Destroy
    needs: main-destroy # Wait for main to be fully destroyed
    runs-on: ubuntu-latest
    environment: destroy # Requires manual approval (second confirmation)
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: bootstrap
        run: terraform init

      - name: Terraform Destroy
        working-directory: bootstrap
        run: terraform destroy -auto-approve
